# Alembic — migrations de schéma.
#
# ⚠️ L'adresse de la base **n'est pas ici**. Elle est lue par `alembic/env.py`
# depuis la configuration de l'application, elle-même alimentée par
# l'environnement. Un mot de passe dans un fichier versionné est un mot de passe
# divulgué, et `sqlalchemy.url` est le premier endroit où on le met par habitude.

[alembic]
script_location = alembic
prepend_sys_path = .

# Horodatage en tête du nom de fichier : les révisions se lisent dans l'ordre
# chronologique dans le dossier, sans avoir à ouvrir chacune pour retrouver sa
# place dans la chaîne.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generique

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generique

[formatter_generique]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
