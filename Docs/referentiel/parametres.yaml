# Référentiel normatif — paramètres fiscaux, sociaux et de gestion, datés
#
# ┌────────────────────────────────────────────────────────────────────────────┐
# │  ÉTAT AU 18 AOÛT 2026 : 50 PARAMÈTRES VALIDÉS, 9 EN ATTENTE                │
# │                                                                            │
# │  Les valeurs validées ont été confrontées une à une aux textes : Code      │
# │  Général des Impôts, lois de finances, textes CNPS, actes uniformes        │
# │  OHADA. Le champ `source` de chaque version dit ce qui a été RÉELLEMENT    │
# │  consulté — pas le texte qu'on aurait aimé lire, la page qu'on a ouverte.  │
# │  Cette distinction est ce qui rend la validation vérifiable par un tiers.  │
# │                                                                            │
# │  Les 9 paramètres restés A_VALIDER n'ont pas été confirmés. Ils ne sont    │
# │  pas oubliés : ils sont marqués. Un rapport qui s'en sert le signale.      │
# └────────────────────────────────────────────────────────────────────────────┘
#
# DEUX NATURES, DEUX AUTORITÉS — ET C'EST LA DISTINCTION QUI MANQUAIT
#
#   nature: LOI                un texte fixe la valeur. Se valide en la confrontant
#                              à l'article visé. Engage un professionnel.
#   nature: POLITIQUE_CABINET  aucun texte ne la fixe. Se valide par une décision
#                              de la direction. La valeur est choisie, pas constatée.
#
# Les poids du score de risque attendaient jusqu'ici la signature d'un fiscaliste,
# qui n'avait aucune qualité pour les attester : rien dans le CGI ne dit combien
# vaut un retard déclaratif dans une note interne. Ils attendaient une signature
# que personne ne pouvait donner. Le défaut du champ est LOI, délibérément : un
# paramètre dont on oublie de déclarer la nature est traité comme engageant.
#
# ⚠️ UNE CORRECTION MAJEURE, LE 18 AOÛT 2026
#
# `SEUIL_ESPECES_DEDUCTIBILITE_TVA` portait 500 000 FCFA. Le CGI art. 143 dit
# 100 000. Cinq fois trop permissif : une facture de 300 000 FCFA réglée en
# espèces passait comme ouvrant droit à déduction. L'erreur ne gênait personne à
# la saisie et se serait découverte au contrôle, en rappel de TVA — c'est le pire
# des deux sens.
#
# Format d'une version :
#   valeur          scalaire ou chaîne
#   applicable_du   date d'entrée en vigueur (bornes : [du, au[ — au exclu)
#   applicable_au   null = toujours en vigueur
#   statut          A_VALIDER | VALIDE | ABROGE
#   fondement       texte visé + source consultée, OBLIGATOIRE
#   valide_par      la personne ou l'entité qui engage sa responsabilité
#   valide_le       la date de cette validation
#   note            précision, divergence de sources, réserve
#
# Le modèle REFUSE une version VALIDE sans `valide_par` ni `valide_le` : une
# validation engage quelqu'un de nommé, jamais l'éditeur du fichier.
#
# Un paramètre sans version applicable à la date demandée lève une erreur.
# Il ne rend jamais de valeur par défaut : une valeur légale silencieusement
# absente est un bug fiscal.

