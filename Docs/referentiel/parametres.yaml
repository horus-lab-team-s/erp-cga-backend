  # ── Clôture et liasse fiscale ──────────────────────────────────────────────

  - code: SEUIL_SYSTEME_NORMAL
    libelle: >-
      Chiffre d'affaires à partir duquel la liasse relève du Système Normal
      SYSCOHADA plutôt que du Système Minimal de Trésorerie
    categorie: CLOTURE
    unite: FCFA
    nature: LOI
    versions:
      - valeur: 60000000
        # Borne : le système minimal est réservé à qui « reste sous » le seuil : cette valeur même relève du normal.
        borne: INCLUSE
        applicable_du: 2018-01-01
        applicable_au: null
        statut: VALIDE
        valide_par: CGA Broad Range Consulting Group (agrément MINFI/DGI n° 00000048)
        valide_le: 2026-08-18
        fondement:
          texte: >-
              AUDCIF art. 13 : le système minimal de trésorerie est réservé aux entités
              dont le chiffre d'affaires annuel hors taxes reste sous 60 000 000 FCFA
              pour le négoce, 40 000 000 pour l'artisanat, 30 000 000 pour les services
          source: >-
              AUDCIF art. 13 ; décret n° 2019/262 du 28 mai 2019 portant application du
              système comptable OHADA révisé, consulté le 18/08/2026
        note: >-
            ⚠️ UN SEUL SEUIL LÀ OÙ LE TEXTE EN MODULE TROIS. La valeur retenue est la
            plus élevée des trois — celle du négoce. Une entité de services réalisant
            45 000 000 FCFA est donc classée au Système Normal alors que le texte
            l'admettrait au SMT. Le sur-classement est le sens d'erreur le moins
            dommageable : une liasse plus détaillée que nécessaire est acceptée,
            l'inverse est rejeté. `liasse.py` signale ce sur-classement plutôt que de
            le subir. Trois paramètres sectoriels restent la bonne cible.

  - code: ABATTEMENT_CGA_PLAFOND
    libelle: Plafond annuel de l'abattement consenti aux adhérents d'un centre de gestion agréé
    categorie: AVANTAGE_CGA
    unite: FCFA
    nature: LOI
    versions:
      - valeur: 0
        applicable_du: 2015-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: Existence d'un plafond à confirmer sur le CGI
          source: Aucune — paramètre créé pour porter la question, pas pour l'affirmer
        note: >-
          ⚠️ VALEUR NULLE SIGNIFIANT « AUCUN PLAFOND CONNU », ET NON « PLAFOND À ZÉRO ».
          Le calcul traite explicitement zéro comme l'absence de plafond — voir
          `application/passage_fiscal.py`. Ce paramètre existe pour que la question soit
          posée au fiscaliste et tracée, plutôt que d'être oubliée : si un plafond
          existe et n'est pas appliqué, l'abattement calculé est trop favorable et la
          liasse est fausse en faveur de l'adhérent, ce qui est la pire des deux erreurs.

  # ── Pilotage : la pondération du score de risque ───────────────────────────
  #
  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │  CES PARAMÈTRES NE SONT PAS DES VALEURS LÉGALES.                         │
  # │                                                                          │
  # │  Ils ne relèvent d'aucun texte et n'ont donc pas à être validés par un    │
  # │  fiscaliste : ce sont des **réglages de la direction du cabinet**. Ils    │
  # │  portent `nature: POLITIQUE_CABINET`, et la direction les a arrêtés le    │
  # │  18 août 2026 — jusque-là, un score calculé sur des poids que personne    │
  # │  n'avait choisis n'était pas un indicateur, c'était une opinion du        │
  # │  développeur.                                                            │
  # │                                                                          │
  # │  Ils vivent au référentiel plutôt que dans le code pour une raison        │
  # │  précise, écrite au § 01 du dossier d'architecture : « la pondération     │
  # │  des composantes du score appartient à la direction ». Une direction qui  │
  # │  doit demander un déploiement pour changer un poids ne pilote pas.        │
  # └──────────────────────────────────────────────────────────────────────────┘

  - code: POIDS_RISQUE_ANOMALIES_BLOQUANTES
