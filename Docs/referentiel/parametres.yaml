  - code: DSF_DELAI_JOURS_APRES_CLOTURE
    libelle: >-
      Délai en jours après la clôture de l'exercice pour le dépôt de la Déclaration
      Statistique et Fiscale
    categorie: ECHEANCE
    unite: JOURS
    nature: LOI
    versions:
      - valeur: 75
        applicable_du: 2019-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: >-
            15 mars pour un exercice clos au 31 décembre, soit 75 jours après clôture
          source: Document de cadrage § 2.3
        note: >-
            ⚠️ LE MODÈLE EST FAUX, PAS SEULEMENT LA VALEUR. La date limite de dépôt de
            la DSF est confirmée au 15 mars pour un exercice clos le 31 décembre. Or
            le texte fixe une DATE, quand ce paramètre exprime un DÉLAI : 31 décembre
            + 75 jours tombe le 16 mars en année ordinaire et le 15 mars en année
            bissextile. Un jour d'écart, une année sur quatre, du bon côté par hasard.
            `EcheanceReglementaire` porte déjà `jour_civil` et `mois_civil` : c'est
            par là que la DSF doit passer, et ce paramètre doit disparaître plutôt
            qu'être corrigé à 74. S'y ajoute l'échelonnement par centre — CDI, CIME,
            DGE — dont les valeurs restent à obtenir. Maintenu A_VALIDER pour cette
            raison.
