        valide_le: 2026-08-18
        fondement:
          texte: >-
              Poids des anomalies bloquantes dans le score de risque du dossier
          source: >-
              Arrêté par la direction du cabinet le 18 août 2026, en application du § 01
              du dossier d'architecture qui réserve la pondération du score de risque à
              la direction
        note: >-
          Le poids le plus élevé du barème, et délibérément : une anomalie bloquante
          non levée interdit la comptabilisation. Le dossier ne peut pas avancer, et
          l'échéance, elle, avance quand même.

