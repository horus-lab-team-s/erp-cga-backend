  # ── Déductibilité ──────────────────────────────────────────────────────────

  - code: SEUIL_ESPECES_DEDUCTIBILITE_TVA
    libelle: >-
      Montant à partir duquel un règlement en espèces exclut la déduction de la TVA
    categorie: DEDUCTIBILITE
    unite: FCFA
    nature: LOI
    versions:
      - valeur: 100000
        # Borne : « au moins égale à cent mille » : cette valeur même est visée.
        borne: INCLUSE
        applicable_du: 2019-01-01
        applicable_au: null
        statut: VALIDE
        valide_par: CGA Broad Range Consulting Group (agrément MINFI/DGI n° 00000048)
        valide_le: 2026-08-18
        fondement:
          texte: >-
              CGI art. 143 : « Pour les opérations taxables d'une valeur au moins égale
              à cent mille (100 000) F CFA, le droit à déduction n'est autorisé qu'à
              condition que les dites opérations n'aient pas été payées en espèces. »
          source: >-
              DGI, fiche « La Taxe sur la Valeur Ajoutée : ce que vous devez savoir »,
              impots.cm, consultée le 18/08/2026 (citation littérale du texte)
        note: >-
            ⚠️ CORRECTION DU 18/08/2026. La valeur portée jusqu'ici était 500 000
            FCFA, soit cinq fois le seuil légal. Une facture de 300 000 FCFA réglée en
            espèces passait donc comme ouvrant droit à déduction, alors que le texte
            l'exclut. Le sens de l'erreur était le plus coûteux des deux : il ne
            gênait personne à la saisie et se serait découvert au contrôle, en rappel
            de TVA. La borne est STRICTE : à exactement 100 000 FCFA, la déduction est
            refusée, ce que le prédicat de FAC-ACH-007 traduit par « < seuil ».

  - code: DELAI_DROIT_DEDUCTION_EXERCICES
    libelle: >-
