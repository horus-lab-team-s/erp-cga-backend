        applicable_du: 2003-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: >-
            Ordonnance n° 89/004 du 13/12/1989, art. 3 et 6, modifiée par la loi de finances
            2003 : redevance audiovisuelle mensuelle sur les salaires, par palier de salaire
            brut. Exonérés : personnels domestiques, ouvriers agricoles, pensions.
          source: >-
            Reproduite en annexe du Code général des impôts, édition officielle 2026 (DGI),
            consulté le 15/10/2026 : https://www.impots.cm/sites/default/files/publications/CODE%20GENERAL%20DES%20IMPOTS%202026%20%20VERSION%20FRANCAISE.pdf
        note: >-
          L'assiette est le salaire brut ; le texte ne dit pas si les avantages en nature
          y entrent : le bulletin retient le brut en espèces (base et primes), à confirmer
          par le fiscaliste. Les exonérations (domestiques, ouvriers agricoles) ne sont pas
          encore portées par le contrat.

