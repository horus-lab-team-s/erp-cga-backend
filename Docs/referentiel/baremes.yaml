            plafond: 75001
            montant: 3000
          - plancher: 75001
            plafond: 100001
            montant: 6000
          - plancher: 100001
            plafond: 125001
            montant: 9000
          - plancher: 125001
            plafond: 150001
            montant: 12000
          - plancher: 150001
            plafond: 200001
            montant: 15000
          - plancher: 200001
            plafond: 250001
            montant: 18000
          - plancher: 250001
            plafond: 300001
            montant: 24000
          - plancher: 300001
            plafond: 500001
            montant: 27000
          - plancher: 500001
            plafond: null
            montant: 30000
        applicable_du: 2012-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: >-
            CGI art. C86 et C87 : taxe de développement local des salariés, montant annuel
            par palier de salaire de base mensuel, perçue avec l'IRPP. LF 2026 : « sans
            changement » pour les salariés.
          source: >-
            DGI, Code général des impôts, édition officielle 2026, art. C86-C87, consulté
            le 15/10/2026 : https://www.impots.cm/sites/default/files/publications/CODE%20GENERAL%20DES%20IMPOTS%202026%20%20VERSION%20FRANCAISE.pdf
        note: >-
          Montants ANNUELS, tels que le texte les donne : le bulletin en retient le
          douzième chaque mois. Cette mensualisation est une pratique de retenue, pas une
          lettre du texte : à confirmer par le fiscaliste. Bornes inclusives au texte
          (« 62 000 à 75 000 », puis « 75 001 ») : chaque plafond exclu en est le
          lendemain. Remplace, le 15 octobre 2026, la modélisation en taux faite faute de
          tranche à montant fixe au référentiel.

  - code: RAV_SALAIRES
    libelle: >-
      Redevance audiovisuelle retenue sur salaires — montant MENSUEL fixe par palier de
      salaire brut
    categorie: PAIE
