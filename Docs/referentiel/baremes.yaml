# Référentiel normatif — barèmes progressifs
#
# ┌────────────────────────────────────────────────────────────────────────────┐
# │  AVERTISSEMENT                                                             │
# │                                                                            │
# │  Aucune valeur de ce fichier n'a été validée sur le Code Général des       │
# │  Impôts. Toutes proviennent de sources secondaires. Elles sont au statut   │
# │  A_VALIDER.                                                                │
# │                                                                            │
# │  ⚠️ Un barème faux ne se voit pas. Un taux erroné sur une facture se        │
# │  remarque ; un impôt sur salaire calculé sur un barème périmé sort un      │
# │  bulletin plausible, signé, remis au salarié, et le redressement arrive    │
# │  trois ans plus tard sur toute la masse salariale.                         │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Format d'une version :
#   tranches        liste de { plancher, plafond, taux } — plafond exclu,
#                   `plafond: null` pour la dernière tranche
#   applicable_du   date d'entrée en vigueur
#   applicable_au   null = toujours en vigueur
#   statut          A_VALIDER | VALIDE | ABROGE
#   fondement       texte + source, OBLIGATOIRE
#
# Les tranches doivent être contiguës, commencer à zéro et finir ouvertes.
# `VersionBareme` le vérifie à la construction : une erreur de saisie fait
# échouer le démarrage plutôt que de sortir un bulletin faux.

version_referentiel: "2026.1"
mis_a_jour_le: 2026-10-15

baremes:

  - code: IRPP_SALAIRES
    libelle: >-
      Barème progressif de l'impôt sur le revenu des personnes physiques,
      catégorie traitements et salaires — assiette annuelle
    categorie: PAIE
    versions:
      - tranches:
          - plancher: 0
            plafond: 2000000
            taux: 10
          - plancher: 2000000
            plafond: 3000000
            taux: 15
          - plancher: 3000000
            plafond: 5000000
            taux: 25
          - plancher: 5000000
            plafond: null
            taux: 35
        applicable_du: 2015-01-01
        applicable_au: null
        statut: A_VALIDER
        fondement:
          texte: >-
            CGI art. 69 — barème de l'IRPP applicable au revenu net catégoriel des
            traitements, salaires, pensions et rentes viagères
          source: >-
            DGI, Code général des impôts, édition officielle 2026, art. 69(1), inchangé par
            la LF 2026, consulté le 15/10/2026 : https://www.impots.cm/sites/default/files/publications/CODE%20GENERAL%20DES%20IMPOTS%202026%20%20VERSION%20FRANCAISE.pdf
        note: >-
          ⚠️ TROIS RÉSERVES, toutes à lever par le fiscaliste avant toute paie réelle.
          1. Le barème est **annuel** : l'appliquer à un salaire mensuel donnerait un
             impôt dix fois trop élevé. Le calcul mensualise, voir `application/paie.py`.
          2. Les centimes additionnels communaux (10 %) s'ajoutent **après** ce barème
             et ne sont pas inclus dans ces taux — voir CAC_TAUX.
          3. L'assiette est le revenu **net** après abattement pour frais
             professionnels et abattement forfaitaire : ce ne sont pas les tranches
             qui portent l'abattement mais le calcul qui les précède.

  - code: TDL_SALAIRES
