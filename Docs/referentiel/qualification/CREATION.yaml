service: CREATION
version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ VERSION 3 (8 novembre 2026) : la réunion du 4 novembre avec la responsable.
#
# * La localisation se choisit dans le référentiel géographique (région ›
#   département › arrondissement › ville › quartier) : `arrondissement_siege`
#   porte `saisie: LOCALISATION`, et le site remplit avec lui `region_siege`,
#   `ville_siege` et `quartier_siege`. La ville dit le centre de formalités, le
#   quartier le centre des impôts de rattachement.
# * Le bail n'est plus attendu à la demande : il ne se signe qu'au nom de la
#   société, une fois créée. Le LOYER suffit à estimer son enregistrement.
# * Les statuts du client sont facultatifs : le cabinet rédige à partir de son modèle.
# * La nationalité, la profession réglementée, l'activité minière et la demande
#   faite pour un tiers : chacune ajoute ses pièces au dossier de formalité
#   (`creation_entreprise/domaine/checklist.py`).
# * Toutes les formes que le portefeuille connaît, l'association (ou ONG) comprise.
# * La consultation préalable, posée en premier (`consultation_prealable`).
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ CE QUE LE SITE DEMANDE AU CLIENT (14 octobre 2026).
#
# `visiteur: true` propose la question sur le site, toujours facultative. La
# réponse ouvre la qualification déjà remplie : le responsable ne redemande pas
# au téléphone ce que le client a écrit.
#
# `libelle_visiteur` dit la question au client, `libelle` la dit au juriste.
# `libelles_valeurs` donne un nom lisible aux valeurs d'une liste.
#
# ⚠️ La version reste « 2 » : aucune question n'est ajoutée, retirée ni changée
# de sens. Une qualification ancienne se relit exactement comme avant.
#
# `pages_statuts` n'est pas posée au client : elle n'a de sens que pour celui
# qui estime un temps de relecture.
# ─────────────────────────────────────────────────────────────────────────────

questions:
  # 8 novembre 2026 (réunion du 4 novembre) : la consultation AVANT le formulaire. « Le
  # client ne doit pas seulement arriver en disant : voici mes informations, créez. »
  # L'agent la voit à la qualification et ajoute la consultation à la proforma.
  - code: consultation_prealable
    visiteur: true
    libelle_visiteur: "Souhaitez-vous commencer par une consultation ?"
    aide_visiteur: >-
      Recommandé si vous hésitez sur la forme de société ou sur vos activités : un conseiller
      étudie votre projet avec vous (forme, activités, charges fiscales à prévoir) avant de créer.
    libelle: Consultation préalable demandée
    type: BOOLEEN
    rang: 0
    aide: >-
      Le client veut d'abord être conseillé : forme juridique, activités à déclarer (au moins
      une pour les produits, une pour les services), charges fiscales qui l'attendent.
      Ajouter la consultation à la proforma.

  - code: forme_juridique
    visiteur: true
    libelle_visiteur: "Quelle forme de société voulez-vous créer ?"
    aide_visiteur: >-
      Si vous hésitez, laissez vide, ou demandez d'abord une consultation : nous vous aidons à
      choisir la forme et à bien définir vos activités avant de créer.
    libelles_valeurs:
      SARL: "SARL (plusieurs associés)"
      SARLU: "SARL unipersonnelle (un seul associé)"
      SA: "Société anonyme (SA)"
      SAS: "Société par actions simplifiée (SAS)"
      GIE: "Groupement d'intérêt économique (GIE)"
      ETS: "Établissement (entreprise individuelle)"
      SCI: "Société civile immobilière (SCI)"
      ASSOCIATION: "Association ou ONG"
    libelle: Forme juridique retenue
    type: ENUM
    # ⚠️ LES VALEURS DE `FormeJuridique`, l'énumération du portefeuille, et non
    # des libellés écrits ici. Ce champ traverse trois contextes — il chiffre la
    # prestation, il ouvre le dossier de formalité, et il devient la forme de
    # l'entreprise au portefeuille. Cette liste portait `SARL_UNIPERSONNELLE` et
    # `ETABLISSEMENT` ; le domaine dit `SARLU` et `ETS`. Corrigé le 27 septembre,
    # le jour où l'on a découvert que trois vocabulaires désignaient la création.
    valeurs: [SARL, SARLU, SA, SAS, GIE, ETS, SCI, ASSOCIATION]
    rang: 1
    obligatoire: true
    aide: >-
      Ce que le client veut créer. En cas d'hésitation entre SARL et SARL unipersonnelle, le nombre d'associés tranche.

  - code: associes
    visiteur: true
    libelle_visiteur: "Combien serez-vous d'associés, vous compris ?"
    libelle: Nombre d'associés
    type: ENTIER
    rang: 3
    obligatoire: true
    aide: >-
      Un seul associé impose la forme unipersonnelle. Au-delà de cinq, les statuts demandent plus de travail.

  - code: capital_social
    visiteur: true
    libelle_visiteur: "Quel capital envisagez-vous ?"
    aide_visiteur: "Un ordre de grandeur suffit."
    libelle: Capital social envisagé
    type: DECIMAL
    unite: FCFA
    rang: 4
    obligatoire: true

  - code: apports_en_nature
    visiteur: true
    libelle_visiteur: "Apporterez-vous autre chose que de l'argent (matériel, véhicule, local) ?"
    libelle: Y a-t-il des apports en nature ?
    type: BOOLEEN
    rang: 5
    obligatoire: true
    aide: >-
      Un apport en nature peut exiger un commissaire aux apports, ce qui change le calendrier et le coût.

  - code: chiffre_affaires_prevu
    visiteur: true
    libelle_visiteur: "Quel chiffre d'affaires visez-vous la première année ?"
    libelles_valeurs:
      MOINS_10M: "Moins de 10 millions de FCFA"
      DE_10M_A_50M: "De 10 à 50 millions de FCFA"
      DE_50M_A_250M: "De 50 à 250 millions de FCFA"
      PLUS_250M: "Plus de 250 millions de FCFA"
    libelle: Chiffre d'affaires prévisionnel, en tranche
    type: ENUM
    valeurs: [MOINS_10M, DE_10M_A_50M, DE_50M_A_250M, PLUS_250M]
    rang: 6
    obligatoire: true
    aide: >-
      En tranche et non en montant : un prévisionnel au franc près est une fausse précision, et le régime fiscal se décide par seuils.

  - code: salaries_prevus
    visiteur: true
    libelle_visiteur: "Combien de salariés prévoyez-vous la première année ?"
    aide_visiteur: "Zéro si vous démarrez seul."
    libelle: Salariés prévus la première année
    type: ENTIER
    rang: 7
    obligatoire: true

  - code: region_siege
    visiteur: true
    libelle_visiteur: "Dans quelle région sera le siège ?"
    libelles_valeurs:
      LITTORAL: "Littoral"
      CENTRE: "Centre"
      OUEST: "Ouest"
      NORD_OUEST: "Nord-Ouest"
      SUD_OUEST: "Sud-Ouest"
      NORD: "Nord"
      EXTREME_NORD: "Extrême-Nord"
      ADAMAOUA: "Adamaoua"
      EST: "Est"
      SUD: "Sud"
    libelle: Région du siège social
    type: ENUM
    valeurs:
      - LITTORAL
      - CENTRE
      - OUEST
      - NORD_OUEST
      - SUD_OUEST
      - NORD
      - EXTREME_NORD
      - ADAMAOUA
      - EST
      - SUD
    rang: 8
    obligatoire: true
    aide: >-
      Détermine le centre des impôts compétent, et l'agence du centre qui suivra le dossier.
      Remplie par le site avec l'arrondissement choisi (version 3).

  - code: arrondissement_siege
    visiteur: true
    saisie: LOCALISATION
    libelle_visiteur: "Où sera installée l'entreprise ?"
    aide_visiteur: >-
      Choisissez la région, le département, l'arrondissement, puis la ville et le quartier. La
      ville indique le centre où déposer le dossier, le quartier le centre des impôts.
    libelle: Arrondissement du siège (code officiel INC)
    type: TEXTE
    rang: 9
    aide: >-
      Le code de l'arrondissement au découpage officiel (`Docs/referentiel/geographie/`), par
      exemple CM005004001 pour Douala 1er. Le département et la région s'en déduisent.

  - code: ville_siege
    visiteur: true
    libelle_visiteur: "Ville"
    libelle: Ville du siège
    type: TEXTE
    rang: 10
    aide: Donne le centre de formalités où déposer le dossier.

  - code: quartier_siege
    visiteur: true
    libelle_visiteur: "Quartier"
    libelle: Quartier du siège
    type: TEXTE
    rang: 11
    aide: >-
      Donne le centre des impôts de rattachement. ⚠️ La liste des quartiers est partielle :
      le client peut avoir écrit un quartier qui n'y figure pas.

  - code: activite
    visiteur: true
    libelle_visiteur: "Quelle sera votre activité principale ?"
    aide_visiteur: >-
      Pensez à tout ce que vous ferez : un garagiste qui vend aussi des pièces exerce la
      mécanique ET le commerce. Une activité absente des statuts ne peut pas être facturée.
    libelle: Activité principale, selon la nomenclature
    type: TEXTE
    rang: 13
    obligatoire: true

  - code: denomination_souhaitee
    visiteur: true
    libelle_visiteur: "Quel nom voulez-vous donner à votre société ?"
    aide_visiteur: >-
      Deux entreprises ne peuvent pas porter le même nom au Cameroun : nous vérifierons sa
      disponibilité au registre du commerce. Prévoyez un second choix.
    libelle: Dénomination souhaitée pour la société
    type: TEXTE
    rang: 2
    obligatoire: true
    aide: >-
      Le nom que le client veut donner à sa société. Posé juste après la forme
      juridique, qui reste la première question — voir le cas de recette qui le
      garde : demander le capital avant la forme fait interrompre le
      responsable par le client. Demandé parce que c'est
      le premier champ du dossier de formalité, et que ce dossier s'ouvre tout
      seul dès l'encaissement : sans ce nom, il s'ouvrirait vide ou pas du tout.
      La disponibilité au RCCM se vérifie plus tard, à la constitution.

  - code: siege
    visiteur: true
    libelle_visiteur: "À quelle adresse sera le siège ?"
    aide_visiteur: "Une rue ou un repère, si vous l'avez : la ville et le quartier sont demandés plus haut."
    libelle: Adresse du siège social
    type: TEXTE
    rang: 12
    obligatoire: true
    aide: >-
      L'adresse, et non la région : `region_siege` sert au barème et au centre
      des impôts compétent, celle-ci figure aux statuts. Un quartier et une ville
      suffisent à ouvrir le dossier ; le complément se porte à la constitution.

  - code: statuts_apportes
    visiteur: true
    libelle_visiteur: "Avez-vous déjà des statuts rédigés ?"
    aide_visiteur: >-
      Facultatif. Le cabinet rédige vos statuts à partir de son modèle, conforme au droit
      OHADA ; des statuts repris d'un autre pays sont souvent à reprendre en entier.
    libelle: Le client apporte-t-il des statuts déjà rédigés ?
    type: BOOLEEN
    rang: 14

  - code: pages_statuts
    libelle: Nombre de pages des statuts apportés
    type: ENTIER
    rang: 15
    aide: >-
      Sans objet si le centre les rédige. Sert à estimer le temps de relecture.

  - code: pieces_deja_reunies
    visiteur: true
    libelle_visiteur: "Quelles pièces avez-vous déjà réunies ?"
    aide_visiteur: "Par exemple : pièces d'identité, plan de localisation. Séparez par des virgules."
    libelle: Pièces déjà réunies par le client
    type: LISTE
    rang: 16
    aide: >-
      Séparées par des virgules. Ce qui est déjà là réduit le va-et-vient.

  # ── Version 3 (8 novembre 2026) : ce qui ajoute des pièces au dossier ───────

  - code: loyer_mensuel
    visiteur: true
    libelle_visiteur: "Quel sera le loyer mensuel du local ?"
    aide_visiteur: >-
      Le bail ne se signe qu'au nom de la société, une fois créée : le montant suffit pour
      estimer son enregistrement. Zéro si vous êtes propriétaire ou hébergé.
    libelle: Loyer mensuel du local du siège
    type: DECIMAL
    unite: FCFA
    rang: 17
    aide: >-
      Sert à chiffrer l'enregistrement du bail, signé après la création au nom de la société.
      Zéro : propriétaire ou hébergé (titre foncier ou attestation d'hébergement).

  - code: nationalite_promoteur
    visiteur: true
    libelle_visiteur: "Quelle est la nationalité du promoteur ?"
    aide_visiteur: >-
      Pour un promoteur étranger : le passeport remplace la CNI, et une autorisation ou une
      attestation d'exercer l'activité est demandée.
    libelles_valeurs:
      CAMEROUNAISE: "Camerounaise"
      ETRANGERE: "Étrangère"
    libelle: Nationalité du promoteur
    type: ENUM
    valeurs: [CAMEROUNAISE, ETRANGERE]
    rang: 18

  - code: profession_reglementee
    visiteur: true
    libelle_visiteur: "L'activité relève-t-elle d'une profession réglementée ?"
    aide_visiteur: >-
      Médecin, vétérinaire, avocat… : l'attestation d'inscription à l'Ordre est exigée, et pour
      une société d'avocats avant même le dépôt au centre.
    libelles_valeurs:
      AUCUNE: "Non"
      MEDECIN: "Médecin"
      CHIRURGIEN_DENTISTE: "Chirurgien-dentiste"
      PHARMACIEN: "Pharmacien"
      VETERINAIRE: "Vétérinaire"
      AVOCAT: "Avocat"
      NOTAIRE: "Notaire"
      HUISSIER: "Huissier de justice"
      ARCHITECTE: "Architecte"
      EXPERT_COMPTABLE: "Expert-comptable"
      AUTRE: "Autre profession réglementée"
    libelle: Profession réglementée
    type: ENUM
    valeurs:
      - AUCUNE
      - MEDECIN
      - CHIRURGIEN_DENTISTE
      - PHARMACIEN
      - VETERINAIRE
      - AVOCAT
      - NOTAIRE
      - HUISSIER
      - ARCHITECTE
      - EXPERT_COMPTABLE
      - AUTRE
    rang: 19
    aide: >-
      ⚠️ Liste à valider par le cabinet : ajoute au dossier l'attestation d'inscription à
      l'Ordre (ou à la Chambre) de la profession.

  - code: activite_miniere
    visiteur: true
    libelle_visiteur: "L'activité touche-t-elle aux mines ou aux carrières ?"
    libelle: Activité minière ou de carrière
    type: BOOLEEN
    rang: 20
    aide: >-
      Ajoute au dossier l'autorisation ou le titre minier. ⚠️ Pièces exactes à préciser par
      le cabinet.

  - code: pour_le_compte_d_un_tiers
    visiteur: true
    libelle_visiteur: "Faites-vous cette demande pour quelqu'un d'autre ?"
    aide_visiteur: "Une procuration signée du promoteur vous sera demandée."
    libelle: Demande faite pour le compte du promoteur, par un tiers
    type: BOOLEEN
    rang: 21
    aide: Ajoute au dossier la procuration et la pièce d'identité du mandataire.
