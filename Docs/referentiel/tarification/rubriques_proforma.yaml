# ─────────────────────────────────────────────────────────────────────────────
# LA COMPOSITION DES PROFORMAS DU CENTRE
#
# Transcription fidèle des deux documents que le cabinet emploie réellement :
#
#   Docs/PROFORMA SARL SOUS SEING PRIVEE.pdf              (avec suivi, 505 000)
#   Docs/PROFORMA SARL SOUS SEING PRIVEE SANS SUIVI 1.pdf (sans suivi, 300 000)
#
# ⚠️ RIEN N'EST INVENTÉ ICI. Chaque ligne, chaque montant et chaque intitulé de
# rubrique vient de l'un des deux documents. Les sous-totaux n'y sont pas
# recopiés : ils se calculent, et les recopier créerait une seconde vérité qui
# finirait par diverger de la première.
#
# ⚠️ CE FICHIER PORTE DES PRIX, DONC DES DÉCISIONS.
#
# Le barème d'honoraires du centre n'a jamais été transmis, et `baremes.yaml` le
# dit de ses propres valeurs. Ceux-ci sont différents : ils figurent sur des
# documents que le cabinet envoie à ses clients. Ils sont donc marqués
# `TRANSCRIT`, un état qui dit exactement cela : recopiés d'un document réel, pas
# encore confirmés dans le système par la direction.
#
# POURQUOI DEUX VARIANTES ET NON UNE RÈGLE
#
# La différence entre les deux documents n'est pas additive : prendre le suivi
# ajoute deux rubriques ET fait disparaître les frais de procédure. Écrire cette
# règle ici supposerait qu'elle vaut pour toutes les formes juridiques à venir,
# ce que personne n'a dit. Deux compositions nommées se vérifient d'un coup d'œil
# contre les deux PDF ; une règle se croit sur parole.
# ─────────────────────────────────────────────────────────────────────────────

variantes:
  - code: SARL_SOUS_SEING_AVEC_SUIVI
    service: CREATION
    forme_juridique: SARL
    libelle: >-
      Proforma de formalisation d'entreprise, de suivi fiscal / comptable / juridique (12 mois), adhésion et élaboration de la DSF, suivi contentieux fiscal et social
    titre: PROFORMA DE FORMALISATION POUR UNE SARL
    statut: TRANSCRIT
    source: Docs/PROFORMA SARL SOUS SEING PRIVEE.pdf
    applicable_du: 2026-01-01
    # ⚠️ LA SECONDE PAGE DU DOCUMENT, transcrite mot pour mot (14 octobre 2026).
    # Elle est identique sur les deux proformas du cabinet : écrite une fois ici,
    # sous ancres, et reprise par la variante suivante. La recopier ferait deux
    # listes de pièces qui divergeraient à la première correction.
    documents_a_fournir: &a_fournir
      - >-
        Photocopie de votre CNI camerounaise de l'associé unique ou des associés ; si vous êtes de nationalité étrangère, photocopie de votre passeport
      - Le nom de votre entreprise
      - La liste de ses activités
      - La division des parts sociales et des pourcentages
      - La localisation de l'entreprise
      - La photocopie de la CNI du gérant
      - Le plan de localisation de votre entreprise
      - Le numéro de téléphone de l'entreprise et son adresse mail
      - Liste du personnel
      - Cachet de l'entreprise
      - >-
        Une copie certifiée non timbrée de la CNI ou de l'acte de naissance de l'employé
      - >-
        Une photocopie simple de la CNI et de l'acte de naissance de l'employé
    documents_a_recevoir: &a_recevoir
      - Un registre de commerce et du crédit mobilier
      - Une attestation de création d'entreprise
      - Une attestation d'immatriculation
      - >-
        Une insertion en ligne dans le fichier national des contribuables camerounais
      - Une attestation de conformité fiscale qui vaut titre de patente
      - >-
        Une attestation de non utilisation du personnel d'une durée de 3 mois renouvelable une fois, ou les numéros CNPS de l'entreprise et de son personnel
    delai_d_execution: &delai >-
      8 semaines maximum après relecture et approbation par vous de vos statuts de société, et le paiement des frais au compte bancaire UBA N° 10033-05201-01016000835-92 ou via notre code marchand Orange #150*47# 586853 au nom de BROAD RANGE CONSULTING.
    rubriques:
      - numero: I
        intitule: PROCEDURE AU CFCE
        lignes:
          - libelle: Timbres Statuts (7 pages X 1500 FCFA X 6 exemplaires)
            montant: 63000
          - libelle: Caisse CFCE
            montant: 41500
          - libelle: Publication journal officiel
            montant: 13500
          - libelle: Frais d'ouverture et traitement dossier
            montant: 30000
          - libelle: Frais d'authentification
            montant: 25000
          - libelle: Chemises et impression
            montant: 4000
      - numero: II
        intitule: PROCEDURE IMPOTS
        lignes:
          - libelle: Attestation d'immatriculation
            montant: 3000
          - libelle: Attestation de conformité fiscale
            montant: 25000
          - libelle: Insertion au Fichier National
            montant: 25000
      - numero: III
        intitule: PROCEDURE CNPS
        lignes:
          - libelle: Obtention numéro CNPS de l'entreprise et d'un employé au moins
            montant: 25000
      - numero: IV
        intitule: SUIVI ENTREPRISE SUR 12 MOIS (suivi fiscal, comptable, juridique)
        lignes:
          - libelle: Coût, 12 500 FCFA X 12 mois
            montant: 150000
      - numero: V
        intitule: CONFECTION DECLARATION STATISTIQUE ET FISCALE (dsf)
        lignes:
          - libelle: Coût
            montant: 100000

