# ─────────────────────────────────────────────────────────────────────────────

agrement: "Agrément MINFI/DGI : numéro à renseigner"
engagement: >-
  Le Centre de gestion agréé s'engage sur la sincérité des informations présentées dans
  ce rapport, établies à partir des données de la plateforme à la date indiquée.
sections:
  - RISQUE
  - CHARGE
  - DEROGATIONS
  - QUALITE_DES_REGLES
  - DECISIONS
