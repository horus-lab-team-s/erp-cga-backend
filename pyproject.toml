[project]
name = "backend-erp-cga"
version = "0.1.0"
description = "Backend de la plateforme de suivi fiscal et comptable — CGA Broad Range Consulting Group"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `Query(...)` en valeur par défaut est l'idiome FastAPI pour déclarer un paramètre de
# requête : B008 est un faux positif ici.
"app/contextes/*/adaptateurs/entrant/routes_http.py" = ["B008"]
